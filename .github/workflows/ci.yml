name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v
      - name: Equal-input negative control
        run: python equal_input_benchmark.py
      - name: Metamorphic suite
        run: python metamorphic_lab.py
      - name: Differential suite
        run: python differential_eval.py --variants 5
